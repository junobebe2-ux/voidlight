<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>VOIDLIGHT — hold the last lantern-light</title>
<style>
  @font-face {
    font-family: 'Cinzel';
    src: url('./assets/fonts/Cinzel.ttf') format('truetype');
    font-weight: 400 900;
    font-display: swap;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0a1f; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Voidlight: you are the last lantern-light in a dark void. Move with WASD or arrow keys to outlast the shades, gather light shards to level up, and press Space for a nova burst."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
